name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 说明：这套测试是纯 Python（不触碰 macOS 私有 API），所以只跑 ubuntu。
# 私有仓库的 macOS runner 按 10 倍计费，而它能多验证的东西接近于零。

jobs:
  test:
    name: unittest ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 单元测试
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_*.py" -v

  quality:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装工具链
        run: pip install "ruff>=0.6" "mypy>=1.11"
      - name: ruff
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests
      - name: mypy --strict
        run: mypy src
