[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imehot"
version = "0.2.0"
description = "低侵入、零常驻的热词保管员：观测 macOS 原生拼音输入法的学习结果"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "3Asterism" }]
keywords = ["macos", "input-method", "pinyin", "ime", "launchd", "privacy"]
classifiers = [
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
imehot = "imehot.cli:main"

[project.urls]
Homepage = "https://github.com/3Asterism/imehot"
Issues = "https://github.com/3Asterism/imehot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # 全角标点（，。：；（））是中文文案的一部分，不是笔误。
    # 关掉这三条，否则 500+ 条噪音会淹没真正的问题。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["imehot"]
mypy_path = "src"
